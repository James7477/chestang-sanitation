<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chestang Sanitation Demo</title>
<style>
:root{--navy:#082b4c;--orange:#f36b21;--bg:#f4f7fb;--green:#209c55;--red:#d93645;--line:#dce4ed;--muted:#6a788d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#172437}
button,input,select{font:inherit}button{cursor:pointer}.top{height:68px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px}.brand img{width:45px;height:45px;object-fit:contain;background:#fff;border-radius:50%}.brand span{color:var(--orange)}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 68px)}.side{background:#0a3156;color:#fff;padding:12px}.nav{width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:12px;border-radius:9px;margin:2px 0;font-weight:700}.nav:hover,.nav.active{background:var(--orange)}
.main{padding:16px}.demo{background:#fff5e6;border:1px solid #ffd2a5;color:#8c4a12;padding:10px;border-radius:9px;margin-bottom:12px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px;box-shadow:0 5px 18px rgba(12,42,72,.06)}
.label{font-size:12px;color:var(--muted);font-weight:700}.value{font-size:27px;font-weight:900;color:var(--navy);margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}.orange{color:var(--orange)}
.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:12px}.table{width:100%;border-collapse:collapse}.table th{background:#f6f8fb;text-align:left;font-size:12px;color:#59697d;padding:8px}.table td{padding:9px;border-bottom:1px solid #edf1f5;font-size:13px}
.btn{border:0;border-radius:8px;padding:10px 12px;font-weight:800}.btn-o{background:var(--orange);color:#fff}.btn-n{background:var(--navy);color:#fff}.btn-g{background:var(--green);color:#fff}.btn-r{background:#fff;color:var(--red);border:1px solid var(--red)}.btn-x{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.toolbar input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:10px}
.pill{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:800}.ok{background:#e7f7ed;color:#16743a}.bad{background:#fdecee;color:#b62731}.wait{background:#eef2f6;color:#65758b}
.modalbg{position:fixed;inset:0;background:rgba(2,20,37,.62);display:grid;place-items:center;padding:16px}.modal{background:#fff;border-radius:14px;padding:18px;width:min(620px,100%)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field input,.field select{padding:9px;border:1px solid var(--line);border-radius:8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.progress{height:10px;background:#e8edf3;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}
.driver{max-width:560px;margin:auto}.driver .card{padding:16px}.drivername{font-size:24px;font-weight:900;color:var(--navy)}.routeRow{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.seq{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:900}.done .seq{background:var(--green)}
.landing{min-height:100vh;background:linear-gradient(145deg,#082b4c,#0d3b66);display:grid;place-items:center;padding:20px}.landcard{background:#fff;width:min(760px,100%);border-radius:20px;padding:24px}.landhead{display:flex;gap:14px;align-items:center}.landhead img{width:85px;height:85px;object-fit:contain}.landhead h1{color:var(--navy);margin:0}.landhead h1 span{color:var(--orange)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.choices button{padding:20px;text-align:left;border-radius:12px;border:1px solid var(--line);background:#fff}.choices button:hover{border-color:var(--orange)}
@media(max-width:800px){.shell{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.main{padding:10px}.brand{font-size:17px}.form{grid-template-columns:1fr}.choices{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const seed={
 customers:[
  {id:'1',name:'Sarah Miller',address:'102 Oak Ridge Dr',rate:15,paid:'2026-12-31',order:1},
  {id:'2',name:'James Carter',address:'315 Pine St',rate:15,paid:'2026-09-30',order:2},
  {id:'3',name:'Lisa Robinson',address:'447 Maple Ave',rate:20,paid:'2026-11-30',order:3},
  {id:'4',name:'Michael Evans',address:'208 Cedar Ln',rate:15,paid:'2026-09-30',order:4},
  {id:'5',name:'Angela Cooper',address:'521 Walnut St',rate:15,paid:'2026-10-31',order:5}
 ],
 payments:[{date:'2026-10-05',cid:'1',amount:45,method:'Cash'},{date:'2026-10-04',cid:'3',amount:60,method:'Card'}],
 expenses:[{date:'2026-10-02',cat:'Fuel',vendor:'Shell',amount:82.14},{date:'2026-10-01',cat:'Landfill',vendor:'Landfill',amount:96}],
 status:{'1':'PICKED_UP','2':'PICKED_UP','3':'PENDING','4':'PENDING','5':'PENDING'},
 driver:{name:'Marcus',clocked:false}
};
const KEY='chestang-gh-demo';let db=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(seed);let mode='landing',page='dashboard';
const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(+n||0);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function resetDemo(){localStorage.removeItem(KEY);db=structuredClone(seed);render()}
function owed(c){return c.paid<'2026-10-31'?c.rate:0}function pill(s){return s==='PICKED_UP'?'<span class="pill ok">Picked Up</span>':s==='PROBLEM'?'<span class="pill bad">Problem</span>':'<span class="pill wait">Pending</span>'}
function nav(p,t){return `<button class="nav ${page===p?'active':''}" onclick="page='${p}';render()">${t}</button>`}
function shell(body){return `<div class="top"><div class="brand"><img src="logo.png">CHESTANG <span>SANITATION</span></div><div><b>Joe Ray Chestange</b><br><small>Owner — Demo</small></div></div><div class="shell"><aside class="side">${nav('dashboard','🏠 Dashboard')}${nav('customers','👥 Customers')}${nav('route','🗺️ Route')}${nav('payments','💳 Payments')}${nav('expenses','🧾 Expenses')}${nav('reports','📊 Reports')}<button class="nav" onclick="mode='driver';render()">📱 Driver Portal</button><button class="nav" onclick="mode='landing';render()">↩ Exit Demo</button></aside><main class="main"><div class="demo"><b>DEMO:</b> Fake sample data. Changes stay only in this browser.</div>${body}</main></div>`}
function metric(l,v,c=''){return `<div class="card"><div class="label">${l}</div><div class="value ${c}">${v}</div></div>`}
function landing(){return `<div class="landing"><div class="landcard"><div class="landhead"><img src="logo.png"><div><h1>CHESTANG <span>SANITATION</span></h1><p>Interactive Preview</p></div></div><p>This is a sample working version so you can see the layout and workflow before the real system is connected to a database.</p><div class="choices"><button onclick="mode='owner';page='dashboard';render()"><h3>Owner Dashboard</h3><p>Customers, payments, expenses, routes and reports.</p></button><button onclick="mode='driver';render()"><h3>Driver Portal</h3><p>Clock in, see today’s route and check off stops.</p></button></div><p><button class="btn btn-x" onclick="resetDemo()">Reset Demo</button></p></div></div>`}
function dashboard(){
 const inc=db.payments.reduce((a,p)=>a+p.amount,0),exp=db.expenses.reduce((a,e)=>a+e.amount,0),past=db.customers.filter(c=>owed(c)>0).length,done=Object.values(db.status).filter(s=>s==='PICKED_UP').length;
 return shell(`<div class="cards">${metric("Today's Stops",db.customers.length)}${metric('Active Customers',db.customers.length)}${metric('Past Due',past,'red')}${metric('Payments',money(inc),'green')}${metric('Amount Owed',money(db.customers.reduce((a,c)=>a+owed(c),0)),'orange')}</div><div class="grid"><div class="card"><h2>Thursday Route</h2><div class="progress"><span style="width:${done/db.customers.length*100}%"></span></div><p>${done}/${db.customers.length} stops completed</p><table class="table"><tr><th>#</th><th>Customer</th><th>Address</th><th>Status</th></tr>${db.customers.map(c=>`<tr><td>${c.order}</td><td>${c.name}</td><td>${c.address}</td><td>${pill(db.status[c.id])}</td></tr>`).join('')}</table></div><div><div class="card"><h2>Monthly Snapshot</h2><table class="table"><tr><td>Payments</td><td class="green"><b>${money(inc)}</b></td></tr><tr><td>Expenses</td><td class="red"><b>${money(exp)}</b></td></tr><tr><td>Net</td><td><b>${money(inc-exp)}</b></td></tr></table></div><div class="card"><h2>Driver</h2><p><b>${db.driver.name}</b></p>${db.driver.clocked?'<span class="pill ok">Clocked In</span>':'<span class="pill wait">Off Duty</span>'}</div></div></div>`) }
function customers(){return shell(`<div class="card"><div class="toolbar"><input placeholder="Search customers..." oninput="filterCust(this.value)"><button class="btn btn-o" onclick="custModal()">+ Add Customer</button></div><div id="cust">${custTable(db.customers)}</div></div>`)}
function custTable(a){return `<table class="table"><tr><th>Customer</th><th>Address</th><th>Rate</th><th>Paid Through</th><th>Owed</th><th></th></tr>${a.map(c=>`<tr><td><b>${c.name}</b></td><td>${c.address}</td><td>${money(c.rate)}/mo</td><td>${c.paid}</td><td class="${owed(c)?'red':'green'}"><b>${money(owed(c))}</b></td><td><button class="btn btn-x" onclick="custModal('${c.id}')">Open</button></td></tr>`).join('')}</table>`}
function filterCust(q){$('cust').innerHTML=custTable(db.customers.filter(c=>(c.name+' '+c.address).toLowerCase().includes(q.toLowerCase())))}
function custModal(id=''){let c=db.customers.find(x=>x.id===id)||{name:'',address:'',rate:15,paid:'2026-10-31',order:db.customers.length+1};modal(`<h2>${id?'Customer Account':'New Customer'}</h2><div class="form"><label class="field">Name<input id="n" value="${c.name}"></label><label class="field">Address<input id="a" value="${c.address}"></label><label class="field">Monthly rate<input id="r" type="number" value="${c.rate}"></label><label class="field">Paid through<input id="p" type="date" value="${c.paid}"></label></div><div class="actions">${id?`<button class="btn btn-n" onclick="closeM();payModal('${id}')">Record Payment</button>`:''}<button class="btn btn-x" onclick="closeM()">Cancel</button><button class="btn btn-o" onclick="saveCust('${id}')">Save</button></div>`)}
function saveCust(id){let o={id:id||String(Date.now()),name:$('n').value,address:$('a').value,rate:+$('r').value,paid:$('p').value,order:id?(db.customers.find(x=>x.id===id)?.order||1):db.customers.length+1};if(id)db.customers=db.customers.map(c=>c.id===id?o:c);else{db.customers.push(o);db.status[o.id]='PENDING'}save();closeM();render()}
function payments(){return shell(`<div class="card"><div class="toolbar"><h2 style="flex:1">Payments</h2><button class="btn btn-o" onclick="payModal()">+ Record Payment</button></div><table class="table"><tr><th>Date</th><th>Customer</th><th>Amount</th><th>Method</th></tr>${db.payments.slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${db.customers.find(c=>c.id===p.cid)?.name||''}</td><td class="green"><b>${money(p.amount)}</b></td><td>${p.method}</td></tr>`).join('')}</table></div>`)}
function payModal(cid=''){modal(`<h2>Record Payment</h2><div class="form"><label class="field">Customer<select id="pc">${db.customers.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${c.name}</option>`).join('')}</select></label><label class="field">Amount<input id="pa" type="number" value="15"></label><label class="field">Date<input id="pd" type="date" value="2026-10-07"></label><label class="field">Method<select id="pm"><option>Cash</option><option>Check</option><option>Card</option><option>Online</option></select></label></div><div class="actions"><button class="btn btn-x" onclick="closeM()">Cancel</button><button class="btn btn-o" onclick="savePay()">Save</button></div>`)}
function savePay(){db.payments.push({date:$('pd').value,cid:$('pc').value,amount:+$('pa').value,method:$('pm').value});let c=db.customers.find(x=>x.id===$('pc').value);if(c){let m=Math.floor(+$('pa').value/c.rate);if(m>0){let d=new Date(c.paid+'T12:00:00');d=new Date(d.getFullYear(),d.getMonth()+m+1,0,12);c.paid=d.toISOString().slice(0,10)}}save();closeM();render()}
function expenses(){let total=db.expenses.reduce((a,e)=>a+e.amount,0);return shell(`<div class="cards">${metric('Expenses',money(total),'red')}${metric('Fuel',money(db.expenses.filter(e=>e.cat==='Fuel').reduce((a,e)=>a+e.amount,0)),'orange')}</div><div class="card"><div class="toolbar"><h2 style="flex:1">Expenses</h2><button class="btn btn-o" onclick="expModal()">+ New Expense</button></div><table class="table"><tr><th>Date</th><th>Category</th><th>Vendor</th><th>Amount</th></tr>${db.expenses.slice().reverse().map(e=>`<tr><td>${e.date}</td><td>${e.cat}</td><td>${e.vendor}</td><td class="red"><b>${money(e.amount)}</b></td></tr>`).join('')}</table></div>`)}
function expModal(){modal(`<h2>New Expense</h2><div class="form"><label class="field">Amount<input id="ea" type="number"></label><label class="field">Date<input id="ed" type="date" value="2026-10-07"></label><label class="field">Category<select id="ec"><option>Fuel</option><option>Landfill</option><option>Truck Repair</option><option>Tires</option><option>Insurance</option><option>Payroll</option><option>Other</option></select></label><label class="field">Vendor<input id="ev"></label></div><div class="actions"><button class="btn btn-x" onclick="closeM()">Cancel</button><button class="btn btn-o" onclick="saveExp()">Save</button></div>`)}
function saveExp(){db.expenses.push({date:$('ed').value,cat:$('ec').value,vendor:$('ev').value,amount:+$('ea').value});save();closeM();render()}
function route(){let done=Object.values(db.status).filter(s=>s==='PICKED_UP').length;return shell(`<div class="card"><h2>Thursday Route</h2><p>${done}/${db.customers.length} completed</p><div class="progress"><span style="width:${done/db.customers.length*100}%"></span></div><table class="table"><tr><th>#</th><th>Customer</th><th>Address</th><th>Status</th></tr>${db.customers.map(c=>`<tr><td>${c.order}</td><td>${c.name}</td><td>${c.address}</td><td>${pill(db.status[c.id])}</td></tr>`).join('')}</table></div>`)}
function reports(){let i=db.payments.reduce((a,p)=>a+p.amount,0),e=db.expenses.reduce((a,x)=>a+x.amount,0),o=db.customers.reduce((a,c)=>a+owed(c),0);return shell(`<div class="cards">${metric('Payments',money(i),'green')}${metric('Expenses',money(e),'red')}${metric('Net',money(i-e))}${metric('Outstanding',money(o),'orange')}</div><div class="card"><h2>Reports Preview</h2><p>Live version can add monthly/yearly reports, past-due lists, expense summaries, printable statements and tax reports.</p></div>`)}
function driver(){let done=Object.values(db.status).filter(s=>s==='PICKED_UP').length;return `<div class="top"><div class="brand"><img src="logo.png">CHESTANG <span>SANITATION</span></div><button class="btn btn-x" onclick="mode='landing';render()">Exit</button></div><main class="main"><div class="driver"><div class="card"><div class="drivername">${db.driver.name}</div><p>Route Driver / Collector</p><p>${db.driver.clocked?'<span class="pill ok">Clocked In</span>':'<span class="pill wait">Off Duty</span>'}</p><button class="btn ${db.driver.clocked?'btn-r':'btn-g'}" style="width:100%" onclick="db.driver.clocked=!db.driver.clocked;save();render()">${db.driver.clocked?'Clock Out':'Clock In'}</button></div><div class="card"><h2>Today's Route</h2><p>${done}/${db.customers.length} completed</p><div class="progress"><span style="width:${done/db.customers.length*100}%"></span></div>${db.customers.map(c=>`<div class="routeRow ${db.status[c.id]==='PICKED_UP'?'done':''}"><div class="seq">${c.order}</div><div><b>${c.name}</b><div>${c.address}</div><small>${db.status[c.id]}</small></div><button class="btn btn-x" onclick="stopModal('${c.id}')">Open</button></div>`).join('')}</div></div></main>`}
function stopModal(id){let c=db.customers.find(x=>x.id===id);modal(`<h2>${c.name}</h2><p>${c.address}</p><p><a class="btn btn-n" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.address)}">Open in Maps</a></p><div class="actions"><button class="btn btn-g" onclick="setStop('${id}','PICKED_UP')">Picked Up</button><button class="btn btn-x" onclick="setStop('${id}','NO_TRASH')">No Trash</button><button class="btn btn-x" onclick="setStop('${id}','NOT_OUT')">Not Out</button><button class="btn btn-r" onclick="setStop('${id}','PROBLEM')">Problem</button></div>`)}
function setStop(id,s){db.status[id]=s;save();closeM();render()}
function modal(h){document.body.insertAdjacentHTML('beforeend',`<div class="modalbg" id="mb"><div class="modal">${h}</div></div>`)}function closeM(){$('mb')?.remove()}
function render(){if(mode==='landing')$('app').innerHTML=landing();else if(mode==='driver')$('app').innerHTML=driver();else $('app').innerHTML=({dashboard,customers,route,payments,expenses,reports}[page]||dashboard)()}
render();
</script>
</body>
</html>
